<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play For Happy Blackjack</title>
<meta name="theme-color" content="#0c3a20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="table.css">
<style>
.hands { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.hand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 16px; transition: background .2s, box-shadow .2s; }
.hand.active { background: rgba(255,210,63,.12); box-shadow: 0 0 0 2px rgba(255,210,63,.7); }
.hand .bet-tag { font-family: var(--util); font-weight: 700; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.hand .result { font-family: var(--block); font-size: 14px; min-height: 1.2em; }
.hand .result.win { color: var(--gold); } .hand .result.lose { color: #ffb3b3; } .hand .result.push { color: #fff; }
.divider { height: 0; border-top: 2px dashed rgba(255,255,255,.18); margin: 0 10%; }
.shoe-note { position: absolute; top: 12px; right: 16px; font-family: var(--util); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
</style>
</head>
<body data-page="blackjack">
<div class="wrap">
  <header class="topbar">
    <a class="home-link" href="lobby.html?g=blackjack">&larr; Tables</a>
    <div class="ttl"><h1>Blackjack</h1><span class="tname" id="tname"></span></div>
    <button class="tool" id="sound" aria-pressed="true">Sound on</button>
  </header>

  <section class="felt">
    <span class="shoe-note" id="shoeNote"></span>
    <div class="seat">
      <div class="seat-label">Dealer <span class="total" id="dealerTotal"></span></div>
      <div class="cards" id="dealerCards"></div>
    </div>
    <div class="divider"></div>
    <div class="seat">
      <div class="seat-label">You</div>
      <div class="hands" id="hands"></div>
    </div>
    <div class="message" id="msg" role="status">Place your bet</div>
  </section>

  <div class="readout" aria-live="polite">
    <div class="led"><span class="label">Balance</span><span class="num" id="balance">1000</span></div>
    <div class="led"><span class="label">Bet</span><span class="num" id="bet">0</span></div>
    <div class="led"><span class="label">Last win</span><span class="num" id="last">0</span></div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Add chips">
    <button class="chip" data-v="10">10</button>
    <button class="chip" data-v="25">25</button>
    <button class="chip" data-v="50">50</button>
    <button class="chip" data-v="100">100</button>
  </div>

  <div class="actions">
    <button class="btn alt" id="clear">Clear</button>
    <button class="btn" id="deal">Deal</button>
    <button class="btn" id="rebet" hidden>Rebet &amp; deal</button>
    <button class="btn alt" id="newbet" hidden>New bet</button>
    <button class="btn" id="hit" hidden>Hit</button>
    <button class="btn alt" id="stand" hidden>Stand</button>
    <button class="btn hot" id="double" hidden>Double</button>
    <button class="btn hot" id="split" hidden>Split</button>
  </div>

  <div class="actions"><button class="tool" id="refill">Refill 1000 credits</button></div>
  <p class="rules">6-deck shoe. Dealer stands on all 17s. Blackjack pays 3 to 2, other wins pay 1 to 1. Double on any first two cards; split once on a matching pair. Play credits only.</p>
</div>

<script src="common.js"></script>
<script src="cards.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // which table (1–4): felt colors, chip values, name
  const T = LB.pick('blackjack', 't');
  document.documentElement.style.setProperty('--felt-a', T.a);
  document.documentElement.style.setProperty('--felt-b', T.b);
  $('tname').textContent = `Table ${T.id} · ${T.name}`;
  document.title = `Play For Happy Blackjack · ${T.name}`;
  document.querySelectorAll('.chip').forEach((c, i) => { c.dataset.v = T.chips[i]; c.textContent = T.chips[i]; });
  const MIN = T.chips[0];
  const sleep = ms => new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 40 : ms));
  const START = 1000;
  let balance = LB.get('bj_credits', START);
  let stake = 0, lastStake = LB.get('bj_last', 0);
  let shoe = Cards.shoe(6);
  let dealer = [], hands = [], active = 0, phase = 'bet', busy = false;

  const VAL = r => r === 'A' ? 11 : ('JQK'.includes(r) || r === '10') ? 10 : +r;
  function score(cards) {
    let t = 0, a = 0;
    for (const c of cards) { t += VAL(c.r); if (c.r === 'A') a++; }
    while (t > 21 && a) { t -= 10; a--; }
    return { t, soft: a > 0 };
  }
  const isBJ = cards => cards.length === 2 && score(cards).t === 21;
  function draw() { if (shoe.length < 60) { shoe = Cards.shoe(6); flash('Shuffling a fresh shoe'); } return shoe.pop(); }
  function flash(t) { $('shoeNote').textContent = t; setTimeout(() => { $('shoeNote').textContent = ''; }, 1800); }
  function save() { LB.set('bj_credits', balance); LB.set('bj_last', lastStake); }

  function setMsg(t, cls = '') { const m = $('msg'); m.textContent = t; m.className = 'message ' + cls; }
  function totalText(cards, hideHole) {
    if (!cards.length) return '';
    if (hideHole) return String(VAL(cards[0].r));
    const s = score(cards);
    return s.soft && s.t < 21 ? `${s.t - 10}/${s.t}` : String(s.t);
  }

  function renderHands() {
    const wrap = $('hands'); wrap.innerHTML = '';
    hands.forEach((h, i) => {
      const box = document.createElement('div');
      box.className = 'hand' + (phase === 'player' && i === active && hands.length > 1 ? ' active' : '');
      const top = document.createElement('div'); top.className = 'seat-label';
      top.innerHTML = `<span class="total">${totalText(h.cards)}</span>`;
      const row = document.createElement('div'); row.className = 'cards';
      h.els.forEach(e => row.appendChild(e));
      const tag = document.createElement('div'); tag.className = 'bet-tag'; tag.textContent = `Bet ${h.bet}`;
      const res = document.createElement('div'); res.className = 'result ' + (h.resultCls || ''); res.textContent = h.result || '';
      box.append(top, row, tag, res); wrap.appendChild(box);
    });
  }
  function updateUI() {
    $('balance').textContent = Math.round(balance);
    $('bet').textContent = phase === 'bet' ? stake : hands.reduce((a, h) => a + h.bet, 0);
    $('dealerTotal').textContent = totalText(dealer, phase === 'player' || phase === 'dealing');
    const betting = phase === 'bet', playing = phase === 'player' && !busy, done = phase === 'done';
    document.querySelectorAll('.chip').forEach(c => { c.hidden = !betting; c.disabled = +c.dataset.v > balance - stake; });
    $('clear').hidden = !betting; $('clear').disabled = stake === 0;
    $('deal').hidden = !betting; $('deal').disabled = stake === 0;
    $('rebet').hidden = !done || lastStake === 0; $('rebet').disabled = lastStake > balance;
    $('newbet').hidden = !done;
    $('hit').hidden = $('stand').hidden = !(phase === 'player');
    $('hit').disabled = $('stand').disabled = !playing;
    const h = hands[active];
    const canDouble = playing && h && h.cards.length === 2 && !h.fromSplitAces && balance >= h.bet;
    const canSplit = playing && h && hands.length === 1 && h.cards.length === 2 && h.cards[0].r === h.cards[1].r && balance >= h.bet;
    $('double').hidden = !(phase === 'player'); $('double').disabled = !canDouble;
    $('split').hidden = !(phase === 'player') || !canSplit;
    $('refill').hidden = !(betting && balance + stake < MIN);
    $('sound').textContent = LB.soundOn ? 'Sound on' : 'Sound off';
  }

  // ---------- betting ----------
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    const v = +c.dataset.v; if (phase !== 'bet' || v > balance - stake) return;
    stake += v; LB.sfx.chip(); setMsg(`Bet ${stake}`); updateUI();
  }));
  $('clear').addEventListener('click', () => { stake = 0; LB.sfx.click(); setMsg('Place your bet'); updateUI(); });
  $('deal').addEventListener('click', () => startRound(stake));
  $('rebet').addEventListener('click', () => { if (lastStake <= balance) startRound(lastStake); });
  $('newbet').addEventListener('click', () => { resetTable(); phase = 'bet'; stake = 0; setMsg('Place your bet'); updateUI(); });
  $('refill').addEventListener('click', () => { balance = START; save(); setMsg('Refilled to 1000'); updateUI(); });
  $('sound').addEventListener('click', () => { LB.setSound(!LB.soundOn); updateUI(); });

  function resetTable() { dealer = []; hands = []; active = 0; $('dealerCards').innerHTML = ''; renderHands(); }

  async function giveTo(cardsArr, elsArr, container, down = false) {
    const c = draw(); cardsArr.push(c);
    const e = Cards.el(c, down); elsArr.push(e);
    if (container) container.appendChild(e);
    LB.sfx.card(); return c;
  }

  async function startRound(amount) {
    if (amount <= 0 || amount > balance || busy) return;
    busy = true;
    resetTable();
    balance -= amount; lastStake = amount; stake = 0; save();
    hands = [{ cards: [], els: [], bet: amount, done: false }];
    phase = 'dealing'; setMsg('Dealing…'); updateUI();
    const dEls = [];
    dealer.els = dEls;
    const pc = hands[0];
    renderHands();
    const handRow = () => $('hands').querySelector('.cards');
    await giveTo(pc.cards, pc.els, null); renderHands(); await sleep(260);
    await giveTo(dealer, dEls, $('dealerCards')); updateUI(); await sleep(260);
    await giveTo(pc.cards, pc.els, null); renderHands(); await sleep(260);
    await giveTo(dealer, dEls, $('dealerCards'), true); await sleep(200);
    phase = 'player'; busy = false;
    // naturals
    const dealerPeek = VAL(dealer[0].r) >= 10;
    if (isBJ(pc.cards) || (dealerPeek && isBJ(dealer))) { await finishRound(); return; }
    setMsg('Hit or stand?'); renderHands(); updateUI();
  }

  async function hit() {
    if (phase !== 'player' || busy) return;
    busy = true; updateUI();
    const h = hands[active];
    await giveTo(h.cards, h.els, null); renderHands();
    const t = score(h.cards).t;
    await sleep(220);
    busy = false;
    if (t > 21) { h.done = true; h.result = 'Bust'; h.resultCls = 'lose'; LB.sfx.lose(); await nextHand(); }
    else if (t === 21) { h.done = true; await nextHand(); }
    else updateUI();
  }
  async function stand() { if (phase !== 'player' || busy) return; hands[active].done = true; LB.sfx.click(); await nextHand(); }
  async function doubleDown() {
    const h = hands[active];
    if (phase !== 'player' || busy || h.cards.length !== 2 || balance < h.bet) return;
    balance -= h.bet; h.bet *= 2; save(); LB.sfx.chip();
    busy = true; updateUI();
    await giveTo(h.cards, h.els, null); renderHands(); await sleep(260);
    busy = false; h.done = true;
    if (score(h.cards).t > 21) { h.result = 'Bust'; h.resultCls = 'lose'; LB.sfx.lose(); }
    await nextHand();
  }
  async function split() {
    const h = hands[0];
    if (phase !== 'player' || busy || hands.length !== 1 || h.cards.length !== 2 || h.cards[0].r !== h.cards[1].r || balance < h.bet) return;
    balance -= h.bet; save(); LB.sfx.chip();
    const aces = h.cards[0].r === 'A';
    const h2 = { cards: [h.cards.pop()], els: [h.els.pop()], bet: h.bet, done: false, fromSplitAces: aces };
    h.fromSplitAces = aces;
    hands.push(h2);
    busy = true; renderHands(); updateUI();
    for (const hh of hands) { await giveTo(hh.cards, hh.els, null); renderHands(); await sleep(260); }
    busy = false;
    if (aces) { hands.forEach(x => x.done = true); await nextHand(); return; }   // split aces get one card each
    active = 0; setMsg('Playing hand 1'); renderHands(); updateUI();
  }
  async function nextHand() {
    const i = hands.findIndex(x => !x.done);
    if (i >= 0) { active = i; setMsg(`Playing hand ${i + 1}`); renderHands(); updateUI(); return; }
    await dealerPlay();
  }
  async function dealerPlay() {
    phase = 'dealer'; busy = true; updateUI();
    Cards.reveal(dealer.els[1], dealer[1]); LB.sfx.flip(); updateUI();
    await sleep(450);
    const anyLive = hands.some(h => score(h.cards).t <= 21);
    while (anyLive && score(dealer).t < 17) {
      await giveTo(dealer, dealer.els, $('dealerCards')); updateUI(); await sleep(420);
    }
    busy = false;
    await finishRound();
  }
  async function finishRound() {
    if (dealer.els[1] && dealer.els[1].classList.contains('down')) { Cards.reveal(dealer.els[1], dealer[1]); LB.sfx.flip(); }
    phase = 'done';
    const d = score(dealer).t, dBJ = isBJ(dealer);
    let returned = 0, staked = 0, anyBJ = false;
    for (const h of hands) {
      staked += h.bet;
      const p = score(h.cards).t;
      const pBJ = hands.length === 1 && isBJ(h.cards);
      let back = 0;
      if (p > 21) { h.result = 'Bust'; h.resultCls = 'lose'; }
      else if (pBJ && !dBJ) { back = h.bet * 2.5; h.result = 'Blackjack!'; h.resultCls = 'win'; anyBJ = true; }
      else if (dBJ && !pBJ) { h.result = 'Dealer blackjack'; h.resultCls = 'lose'; }
      else if (pBJ && dBJ) { back = h.bet; h.result = 'Push'; h.resultCls = 'push'; }
      else if (d > 21 || p > d) { back = h.bet * 2; h.result = 'Win'; h.resultCls = 'win'; }
      else if (p === d) { back = h.bet; h.result = 'Push'; h.resultCls = 'push'; }
      else { h.result = 'Lose'; h.resultCls = 'lose'; }
      returned += back;
    }
    balance += returned; save();
    const net = returned - staked;
    $('last').textContent = Math.max(0, Math.round(net));
    renderHands(); updateUI();
    if (net > 0) {
      setMsg(anyBJ ? `Blackjack! +${Math.round(net)}` : `You win +${Math.round(net)}`, 'win');
      anyBJ ? LB.sfx.big() : LB.sfx.win();
      LB.burstAt($('hands'), anyBJ ? 90 : 50, anyBJ ? 1.3 : 1);
    } else if (net === 0 && returned > 0) { setMsg('Push · bet returned'); LB.sfx.push(); }
    else if (net === 0) { setMsg('Even · one hand won, one lost'); LB.sfx.push(); }
    else { const allBust = hands.every(h => h.result === 'Bust'); setMsg(allBust ? 'Bust · dealer wins' : 'Dealer wins', 'lose'); if (!allBust) LB.sfx.lose(); }
  }

  $('hit').addEventListener('click', hit);
  $('stand').addEventListener('click', stand);
  $('double').addEventListener('click', doubleDown);
  $('split').addEventListener('click', split);
  addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON' || e.repeat) return;
    if (phase === 'player') { if (e.key === 'h') hit(); if (e.key === 's') stand(); if (e.key === 'd') doubleDown(); }
    if (e.code === 'Space') { e.preventDefault(); if (phase === 'bet' && stake) startRound(stake); else if (phase === 'done' && lastStake && lastStake <= balance) startRound(lastStake); }
  });

  if (balance < 10) balance = START;
  updateUI();
})();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
