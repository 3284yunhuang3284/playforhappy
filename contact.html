<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play For Happy Contact</title>
<meta name="theme-color" content="#ff9a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one column — back pill, comic title, Penny with speech bubble, message form card, optional contact details card. */
:root {
  --ink: #2a1450; --paper: #fffdf5; --sun: #ffd23f; --pink: #ff5ea8;
  --display: "Luckiest Guy", "Fredoka", Impact, system-ui, sans-serif;
  --body: "Fredoka", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html:lang(vi) { --display: "Baloo 2", "Fredoka", system-ui, sans-serif; --body: "Baloo 2", system-ui, sans-serif; }
html:lang(vi) h1, html:lang(vi) h2, html:lang(vi) .send { font-weight: 800; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body);
  background: linear-gradient(125deg, #ffe14d, #ffb03d 25%, #ff7aa8 50%, #8fd8ff 75%, #ffe14d); background-size: 300% 300%; animation: sky 18s ease-in-out infinite;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px;
}
@keyframes sky { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(rgba(255,255,255,.35) 1.5px, transparent 1.6px) 0 0 / 18px 18px; }
.wrap { position: relative; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.back { align-self: flex-start; padding: 8px 16px 6px; border-radius: 999px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); color: var(--ink); text-decoration: none; font-family: var(--display); font-size: 17px; letter-spacing: .03em; }
h1 { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 72px); line-height: 1; color: #fff; -webkit-text-stroke: .05em var(--ink); paint-order: stroke fill; text-shadow: .06em .07em 0 var(--ink); text-wrap: balance; }
.hello { display: flex; align-items: center; gap: 12px; }
.hello svg { width: 92px; flex: none; animation: wobble 2.4s ease-in-out infinite; filter: drop-shadow(4px 5px 0 rgba(42,20,80,.3)); }
@keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg) translateY(-4px); } }
.bubble { position: relative; padding: 12px 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--ink); font-weight: 600; font-size: 16px; line-height: 1.35; }
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 6px 7px 0 var(--ink); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .02em; }
label { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: 15px; }
input, textarea { font: 16px var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 11px 12px; width: 100%; }
textarea { min-height: 140px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.count { align-self: flex-end; font-size: 13px; color: #6f6290; margin-top: -6px; }
.send { align-self: flex-start; font-family: var(--display); font-size: 20px; letter-spacing: .04em; padding: 11px 22px 8px; border-radius: 16px; color: #fff; background: linear-gradient(90deg, #ff3d8b, #ff7a3d); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; transition: transform .1s; }
.send:hover:not(:disabled) { transform: translateY(-2px) rotate(-1deg); }
.send:disabled { filter: grayscale(.6); cursor: default; }
.status { min-height: 1.3em; font-weight: 600; font-size: 15px; margin: 0; }
.status.ok { color: #14804a; } .status.bad { color: #c2185b; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.ways { display: grid; gap: 10px; }
.way { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #fff6d6; border: 2px solid var(--ink); }
.way b { font-size: 14px; }
.way span { user-select: all; word-break: break-all; font-weight: 600; }
.way button { font: 700 13px var(--body); padding: 6px 12px; border-radius: 10px; border: 2px solid var(--ink); background: var(--sun); color: var(--ink); cursor: pointer; }
@media (max-width: 480px) { .hello { flex-direction: column; } .way { grid-template-columns: 1fr auto; } .way b { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { body, .hello svg { animation: none; } }
</style>
</head>
<body data-page="contact">
<div class="wrap">
  <a class="back" href="./" data-i18n="back_home">&larr; Home</a>
  <h1 data-i18n="ct_title">Say hi!</h1>
  <div class="hello">
    <svg viewBox="0 0 140 130" aria-hidden="true"><path d="M30 70 Q8 56 12 34" fill="none" stroke="#2a1450" stroke-width="7" stroke-linecap="round"/><circle cx="12" cy="32" r="8" fill="#fff" stroke="#2a1450" stroke-width="4"/><rect x="96" y="70" width="38" height="28" rx="4" fill="#fff" stroke="#2a1450" stroke-width="4" transform="rotate(10 115 84)"/><path d="M98 74 l17 12 17-8" fill="none" stroke="#2a1450" stroke-width="3" transform="rotate(10 115 84)"/><circle cx="70" cy="68" r="50" fill="#f5a623" stroke="#2a1450" stroke-width="5"/><circle cx="70" cy="68" r="40" fill="#ffd23f" stroke="#e08a00" stroke-width="3"/><ellipse cx="55" cy="62" rx="9" ry="11" fill="#fff" stroke="#2a1450" stroke-width="3"/><ellipse cx="85" cy="62" rx="9" ry="11" fill="#fff" stroke="#2a1450" stroke-width="3"/><circle cx="57" cy="64" r="5" fill="#2a1450"/><circle cx="87" cy="64" r="5" fill="#2a1450"/><path d="M50 80 Q70 102 90 80 Z" fill="#c81e5a" stroke="#2a1450" stroke-width="4" stroke-linejoin="round"/><ellipse cx="42" cy="78" rx="7" ry="4" fill="#ff7aa8" opacity=".7"/><ellipse cx="98" cy="78" rx="7" ry="4" fill="#ff7aa8" opacity=".7"/></svg>
    <div class="bubble" data-i18n="ct_penny">Got an idea, a bug, or just want to say hi?</div>
  </div>

  <form class="card" id="form" novalidate>
    <h2 data-i18n="contact">Contact</h2>
    <label for="name"><span data-i18n="ct_name">Your name</span><input id="name" name="name" maxlength="80" autocomplete="name"></label>
    <label for="email"><span data-i18n="ct_email">Email (optional)</span><input id="email" name="email" type="email" maxlength="120" autocomplete="email"></label>
    <label for="msg"><span data-i18n="ct_msg">Your message</span><textarea id="msg" name="msg" maxlength="2000"></textarea></label>
    <span class="count" id="count">0 / 2000</span>
    <div class="hp" aria-hidden="true"><label for="website">Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="send" id="send" type="submit" data-i18n="ct_send">Send message</button>
    <p class="status" id="status" role="status"></p>
  </form>

  <section class="card" id="waysCard" hidden>
    <h2 data-i18n="ct_other">Other ways to reach us</h2>
    <div class="ways" id="ways"></div>
  </section>
</div>
<script src="common.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  document.title = `${LB.t('site_name')} · ${LB.t('contact')}`;
  const status = (t, cls = '') => { $('status').textContent = t; $('status').className = 'status ' + cls; };
  $('msg').addEventListener('input', () => { $('count').textContent = `${$('msg').value.length} / 2000`; });
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('msg').value.trim();
    if (!msg) { status(LB.t('ct_empty'), 'bad'); $('msg').focus(); return; }
    $('send').disabled = true; status(LB.t('ct_sending'));
    try {
      const res = await fetch('api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('name').value.trim(), email: $('email').value.trim(), msg, website: $('website').value, lang: LB.lang }) });
      if (res.status === 429) { status(LB.t('ct_slow'), 'bad'); }
      else if (!res.ok) throw new Error();
      else { status(LB.t('ct_sent'), 'ok'); $('msg').value = ''; $('count').textContent = '0 / 2000'; LB.sfx.win(); LB.burstAt($('send'), 50, 1); }
    } catch { status(LB.t('ct_fail'), 'bad'); }
    $('send').disabled = false;
  });

  // owner's contact details from contact.json (empty fields stay hidden)
  const FIELDS = [['email', 'ct_email_l'], ['phone', 'ct_phone_l'], ['whatsapp', 'ct_wa_l'], ['zalo', 'ct_zalo_l'], ['wechat', 'ct_wechat_l'], ['facebook', 'ct_fb_l']];
  fetch('contact.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
    if (!c) return;
    const rows = FIELDS.filter(([k]) => c[k] && String(c[k]).trim());
    if (!rows.length) return;
    const ways = $('ways');
    rows.forEach(([k, label]) => {
      const val = String(c[k]).trim();
      const row = document.createElement('div'); row.className = 'way';
      const b = document.createElement('b'); b.textContent = LB.t(label);
      const span = document.createElement('span'); span.textContent = val;
      const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = LB.t('ct_copy');
      btn.addEventListener('click', () => {
        const done = () => { btn.textContent = LB.t('ct_copied'); setTimeout(() => btn.textContent = LB.t('ct_copy'), 1500); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(span); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
        try { navigator.clipboard.writeText(val).then(done, fallback); } catch { fallback(); }
      });
      row.append(b, span, btn); ways.appendChild(row);
    });
    $('waysCard').hidden = false;
  }).catch(() => {});
})();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
